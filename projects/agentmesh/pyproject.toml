[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentmesh-runtime"
version = "0.1.0"
description = "A policy-aware, auditable runtime for tool-using AI agents"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Pavan Kumar BN"}]

[tool.setuptools.packages.find]
where = ["src"]
